<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Górski Szlak</title>
<style>
html,body{margin:0;height:100%;background:#111814;font-family:Inter,system-ui,sans-serif;color:#fff}
body{display:grid;place-items:center}
main{width:min(1100px,100vw)}
canvas{display:block;width:100%;height:auto;background:#718d8f;box-shadow:0 18px 60px #000b}
@media(max-width:700px){canvas{border-radius:0}}
</style>
</head>
<body>
<main><canvas id="c" width="1100" height="620"></canvas></main>
<script>
const c=document.getElementById("c"),g=c.getContext("2d"),W=c.width,H=c.height;
const K={};addEventListener("keydown",e=>{K[e.key]=1;if(["ArrowLeft","ArrowRight","ArrowUp"," "].includes(e.key))e.preventDefault();if(e.key.toLowerCase()=="r")reset()});
addEventListener("keyup",e=>K[e.key]=0);

const world=5200, ground=540;
let p,cam,rocks,mush,goats,state,start;

function reset(){
 p={x:100,y:470,w:30,h:52,vy:0,on:false,lives:3,m:0,falls:0};
 cam=0;state="play";start=performance.now();
 rocks=[
  [520,495,90,45],[820,455,110,85],[1160,500,65,40],[1430,440,120,100],
  [1780,490,100,50],[2110,455,135,85],[2500,500,70,40],[2780,430,130,110],
  [3180,480,95,60],[3470,420,145,120],[3880,495,80,45],[4170,450,130,90],
  [4510,410,155,130]
 ];
 mush=[[690,430,1],[1010,455,1],[1330,440,-1],[1660,455,1],[2020,410,1],
 [2350,455,-1],[2670,390,1],[3010,450,1],[3320,370,-1],[3710,450,1],
 [4040,400,1],[4380,350,-1]];
 goats=[[1280,455,0],[2250,455,0],[3630,425,0],[4300,405,0]];
}
reset();

function hit(a,b){return a.x<b[0]+b[2]&&a.x+a.w>b[0]&&a.y<b[1]+b[3]&&a.y+a.h>b[1]}
function update(){
 if(state!="play")return;
 if(K.ArrowLeft)p.x-=5.2;if(K.ArrowRight)p.x+=5.2;
 if(K.ArrowUp||K[" "]){if(p.on)p.vy=-14;K.ArrowUp=0;K[" "]=0}
 p.x=Math.max(0,Math.min(world-p.w,p.x));p.vy+=.7;p.y+=p.vy;p.on=false;

 if(p.y+p.h>=ground){p.y=ground-p.h;p.vy=0;p.on=true}
 for(const r of rocks){
   if(p.x+p.w>r[0]&&p.x<r[0]+r[2]&&p.y+p.h<=r[1]+16&&p.y+p.h+p.vy>=r[1]){
    p.y=r[1]-p.h;p.vy=0;p.on=true;
   }
 }
 if(p.y>H+100){p.lives--;p.falls++;p.x=Math.max(40,p.x-180);p.y=350;p.vy=0;if(p.lives<=0)state="lose"}

 for(const m of mush)if(m[2]&&p.x<m[0]+28&&p.x+p.w>m[0]&&p.y<m[1]+28&&p.y+p.h>m[1]){
   if(m[2]>0){p.lives=Math.min(5,p.lives+1);p.m++}else p.lives--;
   m[2]=0;if(p.lives<=0)state="lose";
 }
 for(const q of goats)if(!q[2]&&p.x<q[0]+38&&p.x+p.w>q[0]-5&&p.y<q[1]+42&&p.y+p.h>q[1]){
   if(p.y+p.h<q[1]+22){p.vy=-11;q[2]=1}else{p.lives--;q[2]=1;p.x-=80;if(p.lives<=0)state="lose"}
 }
 if(p.x>world-180)state="win";
 cam+=(p.x-360-cam)*.1;
}

function mountain(x,b,h,far){
 g.fillStyle=far?"#5e7475":"#435c5b";g.beginPath();g.moveTo(x,b);g.lineTo(x+260,b-h);g.lineTo(x+520,b);g.closePath();g.fill();
 if(!far){g.fillStyle="#d9ddd4";g.beginPath();g.moveTo(x+260,b-h);g.lineTo(x+205,b-h+70);g.lineTo(x+260,b-h+38);g.lineTo(x+315,b-h+70);g.closePath();g.fill()}
}
function tree(x,y,s=1){
 g.fillStyle="#302b25";g.fillRect(x-5*s,y,10*s,55*s);
 g.fillStyle="#233d32";for(let i=0;i<3;i++){g.beginPath();g.moveTo(x,y-75*s+i*27*s);g.lineTo(x-42*s,y+12+i*22*s);g.lineTo(x+42*s,y+12+i*22*s);g.closePath();g.fill()}
}
function rock(r){
 g.fillStyle="#3e4542";g.beginPath();g.roundRect(r[0],r[1],r[2],r[3],18);g.fill();
 g.fillStyle="#69706a";g.beginPath();g.moveTo(r[0]+15,r[1]+12);g.lineTo(r[0]+r[2]*.35,r[1]+4);g.lineTo(r[0]+r[2]*.48,r[1]+18);g.lineTo(r[0]+r[2]*.2,r[1]+30);g.closePath();g.fill()
}
function draw(){
 let sky=g.createLinearGradient(0,0,0,H);sky.addColorStop(0,"#688b91");sky.addColorStop(.5,"#a7bbb4");sky.addColorStop(1,"#687762");g.fillStyle=sky;g.fillRect(0,0,W,H);
 // subtle fog
 g.fillStyle="#ffffff12";g.fillRect(0,230,W,160);
 g.save();g.translate(-cam*.12,0);for(let i=-2;i<14;i++)mountain(i*480,430,250+(i%3)*45,true);g.restore();
 g.save();g.translate(-cam*.32,0);for(let i=-2;i<14;i++)mountain(i*560,500,300+(i%2)*50,false);g.restore();

 g.fillStyle="#435a3e";g.fillRect(0,ground,W,H-ground);
 g.save();g.translate(-cam,0);
 // trail
 g.fillStyle="#9a8060";g.beginPath();g.moveTo(0,540);g.quadraticCurveTo(1200,500,2400,545);g.quadraticCurveTo(3600,575,5200,485);g.lineTo(5200,620);g.lineTo(0,620);g.closePath();g.fill();
 for(let i=-50;i<world+200;i+=150)tree(i,470-(i%60),.75+(i%3)*.08);
 for(const r of rocks)rock(r);
 for(const m of mush)if(m[2]){g.font="27px serif";g.fillText(m[2]>0?"🍄":"☠",m[0],m[1]+28)}
 for(const q of goats)if(q[0]<world){g.font="38px serif";g.fillText("🐐",q[0],q[1]+38)}
 // summit
 g.fillStyle="#d9ddd4";g.fillRect(world-125,260,6,280);g.fillStyle="#b3473e";
 g.beginPath();g.moveTo(world-119,265);g.lineTo(world-10,292);g.lineTo(world-119,320);g.closePath();g.fill();
 g.font="42px serif";g.fillText("⛰",world-185,260);
 // player silhouette + backpack
 g.fillStyle="#252c28";g.beginPath();g.arc(p.x+16,p.y+9,10,0,7);g.fill();g.fillRect(p.x+6,p.y+18,20,27);
 g.fillStyle="#9c754f";g.fillRect(p.x+3,p.y+24,7,20);g.fillStyle="#202622";g.fillRect(p.x+6,p.y+44,8,7);g.fillRect(p.x+20,p.y+44,8,7);
 g.restore();

 // HUD
 g.fillStyle="#111a16cc";g.roundRect(22,20,390,76,16);g.fill();
 g.font="21px system-ui";g.fillStyle="#fff";g.fillText("❤️".repeat(p.lives)+"♡".repeat(5-p.lives),40,51);
 g.font="15px system-ui";g.fillText("WYSOKOŚĆ  "+Math.round(p.x/10)+" m",40,78);
 g.fillText("🍄  "+p.m+"     ⛰  "+Math.min(100,Math.round(p.x/(world-180)*100))+"%",205,78);

 if(state!="play"){
  g.fillStyle="#0b1210e8";g.fillRect(0,0,W,H);g.textAlign="center";
  g.font="bold 52px system-ui";g.fillStyle="#fff";g.fillText(state=="win"?"SZCZYT ZDOBYTY":"WYPRAWA ZAKOŃCZONA",W/2,230);
  g.font="21px system-ui";g.fillText("Wysokość: "+Math.round(p.x/10)+" m   •   grzyby: "+p.m+"   •   upadki: "+p.falls,W/2,275);
  g.fillText("Naciśnij R, aby ruszyć ponownie",W/2,325);g.textAlign="left";
 }
}
function loop(){update();draw();requestAnimationFrame(loop)}loop();
</script>
</body>
</html>
