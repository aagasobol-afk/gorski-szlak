<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Górski Szlak 🏔️</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#20352b;background:#f3efe4}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px}
.game{width:min(1000px,100%);background:#fffdf7;border:1px solid #d9d0bd;border-radius:24px;padding:18px;box-shadow:0 16px 50px #0002}
header{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:12px}
h1{margin:0;font-size:clamp(22px,4vw,34px)} header p{margin:4px 0 0;color:#718070}
.stats{display:flex;gap:14px;flex-wrap:wrap;justify-content:flex-end;font-size:17px}
.wrap{position:relative;border-radius:18px;overflow:hidden;border:2px solid #cdbd91}
canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;background:#a8c9d6}
.msg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-size:clamp(28px,6vw,58px);font-weight:800;color:white;text-shadow:0 3px 10px #000;padding:30px;background:#173527aa}
.hidden{display:none!important}
.controls{display:flex;justify-content:center;gap:12px;margin:14px 0 5px}
button{border:0;border-radius:14px;background:#294d3b;color:white;font-size:26px;min-width:70px;padding:10px 18px;box-shadow:0 4px 0 #193226;touch-action:none}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #193226}
.hint{text-align:center;color:#718070;margin:10px 0;font-size:14px}
#restart{display:block;margin:10px auto;background:#b28b35;font-size:18px}
@media(max-width:600px){header{align-items:flex-start;flex-direction:column}.stats{justify-content:flex-start}.game{padding:12px}.controls button{min-width:64px}}
</style>
</head>
<body>
<main class="game">
<header>
<div><h1>🏔️ Górski Szlak</h1><p>Mała wyprawa, wielkie problemy 😂</p></div>
<div class="stats"><span id="lives">❤️❤️❤️</span><span>🍄 <b id="mush">0</b></span><span>🏔️ <b id="height">0</b> m</span></div>
</header>
<div class="wrap"><canvas id="game"></canvas><div id="msg" class="msg hidden"></div></div>
<div class="controls"><button data-k="ArrowLeft">←</button><button data-k="ArrowUp">↑</button><button data-k="ArrowRight">→</button></div>
<p class="hint">← → ruch · ↑ skok · zbieraj podgrzybki · omijaj muchomory · dotrzyj na szczyt</p>
<button id="restart" class="hidden">🔄 Jeszcze raz</button>
</main>
<script>
const c=document.getElementById("game"),x=c.getContext("2d"),l=document.getElementById("lives"),m=document.getElementById("mush"),h=document.getElementById("height"),msg=document.getElementById("msg"),restart=document.getElementById("restart");
const W=960,H=540;c.width=W;c.height=H;let keys={},p,items,obs,lives,good,over,last,won;
function reset(){p={x:80,y:390,w:34,h:52,vy:0,ground:false,inv:0};lives=3;good=0;over=false;won=false;
obs=[270,500,735,930,1120,1320,1510,1720,1960,2240,2520,2810].map((x,i)=>({x,y:450-[0,30,65,80,45,90,40,100,60,120,80,150][i],w:55,h:450-(450-[0,30,65,80,45,90,40,100,60,120,80,150][i])}));
items=[{x:390,y:405,k:1},{x:660,y:395,k:0},{x:1030,y:365,k:1},{x:1380,y:325,k:0},{x:1600,y:375,k:1},{x:1880,y:315,k:0},{x:2140,y:355,k:1},{x:2450,y:315,k:0},{x:2710,y:245,k:1}].map(o=>({...o,got:false}));update();}
function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function hurt(){if(p.inv>0)return;lives--;p.inv=1.3;p.x=Math.max(40,p.x-100);p.vy=-300;if(lives<=0)finish(false);}
function finish(w){over=true;won=w;msg.innerHTML=w?"🏔️<br>ZDOBYŁAŚ SZCZYT!<br><small>Tester Stary: teraz Twoja kolej 😂</small>":"💀<br>KONIEC WYPRAWY<br><small>Muchomory wygrały...</small>";msg.classList.remove("hidden");restart.classList.remove("hidden");}
function update(){l.textContent="❤️".repeat(lives)+"🖤".repeat(Math.max(0,3-lives));m.textContent=good;h.textContent=Math.min(3000,Math.floor(p.x/10));}
function step(dt){if(over)return;p.vx=(keys.ArrowRight?240:0)-(keys.ArrowLeft?240:0);if(keys.ArrowUp&&p.ground){p.vy=-560;p.ground=false}p.vy+=1450*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.ground=false;
for(const o of obs){if(p.x+p.w>o.x&&p.x<o.x+o.w&&p.y+p.h>=o.y&&p.y+p.h<=o.y+35&&p.vy>=0){p.y=o.y-p.h;p.vy=0;p.ground=true}}
if(p.y>600){hurt();p.y=250;p.vy=0}p.inv=Math.max(0,p.inv-dt);
for(const it of items)if(!it.got&&hit(p,{x:it.x-10,y:it.y-24,w:30,h:32})){it.got=true;if(it.k){lives=Math.min(5,lives+1);good++}else hurt();update()}
if(p.x>2920)finish(true);update();}
function draw(){x.clearRect(0,0,W,H);let cam=Math.max(0,Math.min(p.x-260,2050));let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,"#9ec8d8");g.addColorStop(1,"#e7d7b5");x.fillStyle=g;x.fillRect(0,0,W,H);
x.fillStyle="#809a8d";for(let a=-100;a<1200;a+=260){x.beginPath();x.moveTo(a,450);x.lineTo(a+130,150);x.lineTo(a+300,450);x.fill()}x.save();x.translate(-cam,0);
x.fillStyle="#667b4f";x.fillRect(0,450,3100,90);
for(const o of obs){x.fillStyle="#77766b";x.fillRect(o.x,o.y,o.w,450-o.y);x.fillStyle="#9b9889";x.beginPath();x.moveTo(o.x,o.y);x.lineTo(o.x+o.w*.45,o.y-18);x.lineTo(o.x+o.w,o.y);x.fill()}
for(let a=150;a<3000;a+=170){x.fillStyle="#66513c";x.fillRect(a,360,12,90);x.fillStyle="#315b43";x.beginPath();x.moveTo(a-38,375);x.lineTo(a+6,285);x.lineTo(a+50,375);x.fill()}
for(const it of items)if(!it.got){x.font="28px serif";x.fillText(it.k?"🍄":"☠️",it.x-12,it.y+8)}
x.font="40px serif";x.fillText("🏁",2920,290);x.font="24px serif";x.fillText("SZCZYT",2870,325);
if(!(p.inv>0&&Math.floor(p.inv*10)%2===0)){x.font="42px serif";x.fillText("🥾",p.x-5,p.y+42);x.font="28px serif";x.fillText("🧢",p.x,p.y-4)}x.restore();}
function loop(t){let dt=Math.min(.033,(t-last)/1000);last=t;step(dt);draw();requestAnimationFrame(loop)}
addEventListener("keydown",e=>{if(["ArrowLeft","ArrowRight","ArrowUp"," "].includes(e.key))e.preventDefault();keys[e.key]=1});addEventListener("keyup",e=>keys[e.key]=0);
document.querySelectorAll("[data-k]").forEach(b=>{b.onpointerdown=e=>{e.preventDefault();keys[b.dataset.k]=1};["pointerup","pointercancel","pointerleave"].forEach(q=>b.addEventListener(q,()=>keys[b.dataset.k]=0))});restart.onclick=reset;reset();last=performance.now();requestAnimationFrame(loop);
</script>
</body>
</html>
